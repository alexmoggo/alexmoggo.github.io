name: Solar charging controller

on:
  schedule:
    # Every 5 minutes, offset from :00 to reduce GitHub's top-of-hour delays.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solar-controller
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONTROLLER_LIVE: ${{ vars.CONTROLLER_LIVE }}
      HOUSE_LOAD_W: ${{ vars.HOUSE_LOAD_W }}
      MIN_AMPS: ${{ vars.MIN_AMPS }}
      SUNGROW_POWER_POINT: ${{ vars.SUNGROW_POWER_POINT }}
      STATE_FILE: .state/state.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore controller state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: controller-state-${{ github.run_id }}
          restore-keys: controller-state-

      - name: Set up Go (live mode only)
        if: vars.CONTROLLER_LIVE == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Restore tesla-control binary
        if: vars.CONTROLLER_LIVE == 'true'
        id: tc
        uses: actions/cache@v4
        with:
          path: ~/go/bin/tesla-control
          key: tesla-control-v0.4.1-${{ runner.os }}

      - name: Build tesla-control
        if: vars.CONTROLLER_LIVE == 'true' && steps.tc.outputs.cache-hit != 'true'
        run: go install github.com/teslamotors/vehicle-command/cmd/tesla-control@v0.4.1

      - name: Run controller
        env:
          SUNGROW_APPKEY: ${{ secrets.SUNGROW_APPKEY }}
          SUNGROW_SECRET_KEY: ${{ secrets.SUNGROW_SECRET_KEY }}
          SUNGROW_TOKENS: ${{ secrets.SUNGROW_TOKENS }}
          SUNGROW_PLANT_ID: ${{ secrets.SUNGROW_PLANT_ID }}
          TESLA_CLIENT_ID: ${{ secrets.TESLA_CLIENT_ID }}
          TESLA_TOKENS: ${{ secrets.TESLA_TOKENS }}
          TESLA_VIN: ${{ secrets.TESLA_VIN }}
          TESLA_PRIVATE_KEY: ${{ secrets.TESLA_PRIVATE_KEY }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          export PATH="$HOME/go/bin:$PATH"
          python -m controller.main

      - name: Save controller state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: controller-state-${{ github.run_id }}
